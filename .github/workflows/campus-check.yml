name: Campus Week checks
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_upstream:
        description: Check live NTU services
        type: boolean
        required: false
        default: false
concurrency:
  group: campus-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check production dependencies for known serious vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run check
      - name: Verify real public NTU services (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.check_upstream
        run: npm run test:upstream
