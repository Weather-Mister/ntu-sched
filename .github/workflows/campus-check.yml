name: Campus Week checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check public/skeleton/mail.mjs
      - run: node --check src/mail-store.mjs
      - run: node --check src/mail-translation.mjs
      - run: node --check src/worker.mjs
      - name: Verify real public NTU course lookup and syllabus plans
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/automatic-course-syllabus'
        run: node scripts/check-ntu-syllabus.mjs
      - name: Test public NTU syllabus retrieval on experiment branch
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/ntu-course-exam-source'
        run: |
          node --input-type=module <<'NODE'
          import { readNtuCourseExams } from './src/ntu-course-exams.mjs';
          for (const url of ['https://course.ntu.edu.tw/courses/115-1/23006']) {
            try {
              const result=await readNtuCourseExams(url);
              console.log(JSON.stringify({source:result.sourceUrl,term:result.term,courseCode:result.courseCode,serial:result.serial,exams:result.exams.map(x=>({kind:x.kind,date:x.date,certainty:x.certainty}))}));
              if(result.courseCode !== 'CSIE5734' || !result.exams.some(x=>x.kind==='midterm'))process.exitCode=1;
            } catch(error) { console.log('Public NTU smoke check failed:', error.code || 'request_error'); process.exitCode=1; }
          }
          NODE
